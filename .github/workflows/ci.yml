# CI：全量 pytest + 语法编译检查
# 数据缺失的测试（chemical_parser / neo4j）自带 skip；其余用例以仓库内
# sample_data/ 为准跑全量（USE_SAMPLE_DATA=true），无需完整爬取数据即可绿。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      USE_SAMPLE_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  compile:
    name: compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax compile check
        run: python -m compileall -q .
